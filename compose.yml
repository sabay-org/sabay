services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web_http:
    build: .
    depends_on:
      - redis
    command: gunicorn -b 0.0.0.0:8000 -w 3 sabay.wsgi:application
    expose:
      - "8000"

  web_ws:
    build: .
    depends_on:
      - redis
    command: daphne -b 0.0.0.0 -p 8001 sabay.asgi:application
    expose:
      - "8001"

  nginx:
    image: nginx:alpine
    depends_on:
      - web_http
      - web_ws
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
