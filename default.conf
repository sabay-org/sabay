server {
    listen 80;
    server_name 127.0.0.1;

    # Static files location managed by volume sharing
    location /static/ {
        alias /app/static/;
    }

    # Standard HTTP requests routed to the Gunicorn container
    location / {
        proxy_pass http://web_http:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket requests routed to the Daphne container
    location /ws/ {
        proxy_pass http://web_ws:8001;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
